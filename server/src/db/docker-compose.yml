services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: doroom
      POSTGRES_PASSWORD: doroom
      POSTGRES_DB: doroom
    ports: ["5432:5432"]
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@doroom.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
