services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: doroom
      POSTGRES_PASSWORD: doroom
      POSTGRES_DB: doroom
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@doroom.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pgadmin-data:
